<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Wave / Stream Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Radial Glow Behind Text -->
    <radialGradient id="glow" cx="450" cy="110" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 19px;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #38BDF8;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Container Box -->
  <rect width="900" height="220" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <rect width="900" height="220" rx="16" fill="url(#grid)"/>

  <!-- Radial Glow -->
  <circle cx="450" cy="110" r="300" fill="url(#glow)"/>

  <!-- Decorative Tech Wave Lines -->
  <path d="M 0 170 Q 225 130 450 160 T 900 150" fill="none" stroke="url(#waveGrad)" stroke-width="3"/>
  <path d="M 0 185 Q 225 155 450 180 T 900 170" fill="none" stroke="url(#waveGrad)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Decorative Nodes / Sparkles -->
  <circle cx="120" cy="50" r="3" fill="#38BDF8" opacity="0.6"/>
  <circle cx="780" cy="65" r="2.5" fill="#818CF8" opacity="0.7"/>
  <circle cx="830" cy="140" r="2" fill="#38BDF8" opacity="0.4"/>
  <circle cx="80" cy="140" r="2.5" fill="#818CF8" opacity="0.5"/>

  <!-- Status / Pill Badge -->
  <g transform="translate(330, 28)">
    <rect width="240" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10B981"/>
    <text x="26" y="17.5" class="badge-text">DATA ANALYTICS &amp; BI</text>
  </g>

  <!-- Main Title -->
  <text x="450" y="105" text-anchor="middle" class="title" fill="url(#textGrad)">Lucas Paes</text>

  <!-- Subtitle -->
  <text x="450" y="140" text-anchor="middle" class="subtitle">Business Intelligence · Big Data · Prevenção de Perdas</text>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="899" height="219" rx="15.5" fill="none" stroke="#1E293B" stroke-width="1"/>
</svg>
